name: Publicação de função lambda

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurando as credenciais na AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Install dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION }}

      - name: Build Lambda Function
        working-directory: ${{ vars.WORKING_DIRECTORY }}
        run: dotnet publish -c Release -o publish

      - name: Publish Lambda Function
        if: success()
        run: |
          zip -j publish.zip ./${{ vars.WORKING_DIRECTORY }}/publish/*
          aws lambda update-function-code --function-name ${{ vars.FUNCTION_NAME }} --zip-file fileb://publish.zip

      - name: Wait for Lambda update to complete
        if: success()
        run: |
          while true; do
            STATUS=$(aws lambda get-function --function-name ${{ vars.FUNCTION_NAME }} --query 'Configuration.LastUpdateStatus' --output text)
            if [ "$STATUS" = "Successful" ]; then
              break
            elif [ "$STATUS" = "Failed" ]; then
              echo "Lambda update failed"
              exit 1
            else
              sleep 5
            fi
          done

          case "${{ github.base_ref }}" in
              "develop")
                  echo "ALIAS=dev" >> $GITHUB_ENV
                  ;;
              "qas"|"Qas")
                  echo "ALIAS=qas" >> $GITHUB_ENV
                  ;;
              "master")
                  echo "ALIAS=prod" >> $GITHUB_ENV
                  ;;
          esac

          echo "LAMBDA_PUB_VERSION=$(aws lambda publish-version --function-name ${{ vars.FUNCTION_NAME }} | jq -r '.Version')" >> $GITHUB_ENV

      - name: Create Lambda version and set alias
        if: success()
        run: |
          echo "Environment: $ALIAS" 
          echo "Publish Version: $LAMBDA_PUB_VERSION"

          aliases=($(aws lambda list-aliases --function-name ${{ vars.FUNCTION_NAME }} --query Aliases[].Name --output text))

          if [[ ${aliases[@]} =~ "$ALIAS" ]]; then
            aws lambda update-alias --function-name ${{ vars.FUNCTION_NAME }} --name $ALIAS --function-version $LAMBDA_PUB_VERSION
          else
            aws lambda create-alias --function-name ${{ vars.FUNCTION_NAME }} --name $ALIAS --function-version $LAMBDA_PUB_VERSION
          fi

      - name: Delete Lambda without alias
        if: success()
        run: |
          aliases=($(aws lambda list-aliases --function-name ${{ vars.FUNCTION_NAME }} --query Aliases[].FunctionVersion --output text))
          versoes=($(aws lambda list-versions-by-function --function-name ${{ vars.FUNCTION_NAME }} --query Versions[].Version --output text))

          for versao in "${versoes[@]}"; do
              if [ "${versao:1}" != "LATEST" ]; then
                  deleteVersao=true
                  for alias in "${aliases[@]}"; do
                      if [ "$versao" -eq "$alias" ]; then
                          deleteVersao=false
                      fi
                  done

                  if [ "$deleteVersao" = true ]; then
                      aws lambda delete-function --function-name ${{ vars.FUNCTION_NAME }}:$versao
                  fi
              fi
          done