name: Publicação do frontend (MFE)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  build:
    name: Processo de deploy do frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ vars.WORKING_DIRECTORY }}

    steps:
      - uses: actions/checkout@v6

      - name: Configurando Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
            # cache: 'npm'
          # cache-dependency-path: ${{ vars.WORKING_DIRECTORY }}/package-lock.json

      - run: npm i -f

      - name: Compilação do projeto
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: ${{ vars.BUILD_COMMAND }}

      - name: Inspect build output
        run: |
          pwd
          find dist -type d

      - name: Configurando as credenciais na AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Cópia dos chunks com hash (cache longo, imutável)
        run: |
          aws s3 sync ${{ vars.BUILD_OUTPUT_DIR }} s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "remoteEntry.json" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Cópia do remoteEntry.json (nunca pode ficar cacheado)
        run: |
          aws s3 cp ${{ vars.BUILD_OUTPUT_DIR }}/remoteEntry.json \
            s3://${{ secrets.AWS_S3_BUCKET }}/remoteEntry.json \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

      - name: Cópia do index.html (nunca pode ficar cacheado)
        run: |
          aws s3 cp ${{ vars.BUILD_OUTPUT_DIR }}/index.html \
            s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidação do CloudFront (remoteEntry.json e index.html)
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_DISTRIBUTION_ID }} --paths "/remoteEntry.json" "/index.html"
